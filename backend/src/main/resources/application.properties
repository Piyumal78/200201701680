# Spring Boot Application Settings
spring.application.name=training-management-system
server.port=8080

# =============================================================
# MySQL Database Configuration
# =============================================================
spring.datasource.url=jdbc:mysql://localhost:3306/tms_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=

# JPA / Hibernate Properties for MySQL
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Execute data.sql to populate reference tables
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
